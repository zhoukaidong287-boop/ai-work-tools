<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>装修客户跟进 CRM 工具</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 40px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    main {
      padding: 32px 40px;
      max-width: 1400px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #ea580c;
    }

    .btn-blue {
      background: #2563eb;
    }

    .btn-gray {
      background: #6b7280;
    }

    .btn-green {
      background: #16a34a;
    }

    .btn-red {
      background: #dc2626;
    }

    .btn-teal {
      background: #0f766e;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 12px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      padding: 18px;
    }

    .stat-box span {
      display: block;
      color: #333;
      font-weight: 700;
    }

    .stat-box strong {
      display: block;
      font-size: 28px;
      color: #ea580c;
      margin-top: 8px;
    }

    .filter-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 16px;
    }

    .filter-item {
      max-width: 260px;
      flex: 1;
      min-width: 180px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f9fafb;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 12px;
      white-space: nowrap;
    }

    .need-cell,
    .note-cell {
      width: 220px;
      max-width: 220px;
      white-space: normal;
      line-height: 1.6;
      word-break: break-word;
    }

    .action-cell {
      width: 150px;
      white-space: nowrap;
    }

    .empty-tip {
      padding: 24px;
      text-align: center;
      color: #6b7280;
      background: #f9fafb;
    }

    @media (max-width: 900px) {
      main {
        padding: 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>装修客户跟进 CRM 工具</h1>
    <p>客户登记、状态跟进、今日待办、数据统计与客户表导出</p>
  </header>

  <main>
    <section class="card">
      <h2>新增客户</h2>

      <div class="form-grid">
        <div>
          <label>客户姓名</label>
          <input id="name" placeholder="例如：张先生" />
        </div>

        <div>
          <label>联系电话</label>
          <input id="phone" placeholder="例如：13800000000" />
        </div>

        <div>
          <label>小区名称</label>
          <input id="community" placeholder="例如：XX小区" />
        </div>

        <div>
          <label>房屋面积</label>
          <input id="area" placeholder="例如：120㎡" />
        </div>

        <div>
          <label>客户来源</label>
          <select id="source">
            <option>经纪人推荐</option>
            <option>新媒体留资</option>
            <option>门店自然进店</option>
            <option>老客户转介绍</option>
            <option>其他</option>
          </select>
        </div>

        <div>
          <label>跟进状态</label>
          <select id="status">
            <option>待联系</option>
            <option>已联系</option>
            <option>已量房</option>
            <option>已交定金</option>
            <option>已签单</option>
            <option>暂缓</option>
          </select>
        </div>
      </div>

      <div style="margin-top:16px;">
        <label>装修需求</label>
        <textarea id="need" placeholder="例如：整装、旧改、局改、橱柜、衣柜、预算区间等"></textarea>
      </div>

      <div style="margin-top:16px;">
        <label>跟进备注</label>
        <textarea id="followNote" placeholder="例如：客户关注价格，想先看套餐明细；已约明天下午量房"></textarea>
      </div>

      <div style="margin-top:16px; max-width:240px;">
        <label>下次跟进时间</label>
        <input id="nextFollowDate" type="date" />
      </div>

      <div class="button-row">
        <button id="saveButton" class="btn-primary" onclick="saveCustomer()">添加客户</button>
        <button class="btn-blue" onclick="exportCustomers()">导出客户表</button>
        <button class="btn-gray" onclick="clearAllCustomers()">清空全部数据</button>
      </div>
    </section>

    <section class="card">
      <h2>数据统计</h2>

      <div class="stats">
        <div class="stat-box">
          <span>客户总数</span>
          <strong id="total">0</strong>
        </div>

        <div class="stat-box">
          <span>已量房</span>
          <strong id="measured">0</strong>
        </div>

        <div class="stat-box">
          <span>已交定金</span>
          <strong id="deposit">0</strong>
        </div>

        <div class="stat-box">
          <span>已签单</span>
          <strong id="signed">0</strong>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>客户列表</h2>

      <div class="filter-row">
        <div class="filter-item">
          <label>按状态筛选</label>
          <select id="filterStatus" onchange="renderCustomers()">
            <option>全部客户</option>
            <option>待联系</option>
            <option>已联系</option>
            <option>已量房</option>
            <option>已交定金</option>
            <option>已签单</option>
            <option>暂缓</option>
          </select>
        </div>

        <div class="filter-item">
          <label>搜索客户</label>
          <input id="searchKeyword" placeholder="输入姓名、电话或小区" oninput="renderCustomers()" />
        </div>

        <div>
          <button class="btn-teal" onclick="showTodayFollow()">今日待跟进</button>
        </div>

        <div>
          <button class="btn-gray" onclick="resetFilters()">显示全部</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>客户</th>
              <th>电话</th>
              <th>小区</th>
              <th>面积</th>
              <th>来源</th>
              <th>状态</th>
              <th>需求</th>
              <th>跟进备注</th>
              <th>下次跟进</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="customerList"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let customers = JSON.parse(localStorage.getItem("customers")) || [];
    let editingIndex = -1;
    let onlyTodayFollow = false;
    let currentDisplayCustomers = [];

    function saveCustomer() {
      const customer = {
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        community: document.getElementById("community").value.trim(),
        area: document.getElementById("area").value.trim(),
        source: document.getElementById("source").value,
        status: document.getElementById("status").value,
        need: document.getElementById("need").value.trim(),
        followNote: document.getElementById("followNote").value.trim(),
        nextFollowDate: document.getElementById("nextFollowDate").value
      };

      if (!customer.name || !customer.phone) {
        alert("客户姓名和联系电话必须填写");
        return;
      }

      if (editingIndex === -1) {
        customers.push(customer);
      } else {
        customers[editingIndex] = customer;
        editingIndex = -1;
        document.getElementById("saveButton").innerText = "添加客户";
      }

      saveToLocalStorage();
      renderCustomers();
      clearForm();
    }

    function renderCustomers() {
      const list = document.getElementById("customerList");
      list.innerHTML = "";

      const filterStatus = document.getElementById("filterStatus")
        ? document.getElementById("filterStatus").value
        : "全部客户";

      const searchKeyword = document.getElementById("searchKeyword")
        ? document.getElementById("searchKeyword").value.trim()
        : "";

      let displayCustomers = filterStatus === "全部客户"
        ? customers
        : customers.filter(customer => customer.status === filterStatus);

      if (searchKeyword) {
        displayCustomers = displayCustomers.filter(customer => {
          return (
            (customer.name || "").includes(searchKeyword) ||
            (customer.phone || "").includes(searchKeyword) ||
            (customer.community || "").includes(searchKeyword)
          );
        });
      }

      if (onlyTodayFollow) {
        const today = getTodayString();
        displayCustomers = displayCustomers.filter(customer => {
          return customer.nextFollowDate === today;
        });
      }

      currentDisplayCustomers = displayCustomers;

      if (displayCustomers.length === 0) {
        list.innerHTML = `
          <tr>
            <td colspan="10" class="empty-tip">当前没有客户数据</td>
          </tr>
        `;
      } else {
        displayCustomers.forEach(item => {
          const index = customers.indexOf(item);
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${escapeHtml(item.name)}</td>
            <td>${escapeHtml(item.phone)}</td>
            <td>${escapeHtml(item.community)}</td>
            <td>${escapeHtml(item.area)}</td>
            <td>${escapeHtml(item.source)}</td>
            <td><span class="tag">${escapeHtml(item.status)}</span></td>
            <td class="need-cell">${escapeHtml(item.need)}</td>
            <td class="note-cell">${escapeHtml(item.followNote)}</td>
            <td>${escapeHtml(item.nextFollowDate)}</td>
            <td class="action-cell">
              <button class="btn-green btn-small" onclick="editCustomer(${index})">编辑</button>
              <button class="btn-red btn-small" onclick="deleteCustomer(${index})">删除</button>
            </td>
          `;

          list.appendChild(row);
        });
      }

      updateStats();
    }

    function editCustomer(index) {
      const customer = customers[index];

      document.getElementById("name").value = customer.name || "";
      document.getElementById("phone").value = customer.phone || "";
      document.getElementById("community").value = customer.community || "";
      document.getElementById("area").value = customer.area || "";
      document.getElementById("source").value = customer.source || "经纪人推荐";
      document.getElementById("status").value = customer.status || "待联系";
      document.getElementById("need").value = customer.need || "";
      document.getElementById("followNote").value = customer.followNote || "";
      document.getElementById("nextFollowDate").value = customer.nextFollowDate || "";

      editingIndex = index;
      document.getElementById("saveButton").innerText = "更新客户";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function deleteCustomer(index) {
      const confirmDelete = confirm("确定要删除这个客户吗？");

      if (!confirmDelete) {
        return;
      }

      customers.splice(index, 1);
      saveToLocalStorage();
      renderCustomers();
    }

    function clearForm() {
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("community").value = "";
      document.getElementById("area").value = "";
      document.getElementById("source").value = "经纪人推荐";
      document.getElementById("status").value = "待联系";
      document.getElementById("need").value = "";
      document.getElementById("followNote").value = "";
      document.getElementById("nextFollowDate").value = "";
    }

    function saveToLocalStorage() {
      localStorage.setItem("customers", JSON.stringify(customers));
    }

    function clearAllCustomers() {
      const confirmClear = confirm("确定要清空全部客户数据吗？这个操作不能恢复。");

      if (!confirmClear) {
        return;
      }

      customers = [];
      editingIndex = -1;
      onlyTodayFollow = false;
      currentDisplayCustomers = [];

      localStorage.removeItem("customers");

      document.getElementById("saveButton").innerText = "添加客户";
      clearForm();
      resetFilters();

      alert("客户数据已清空");
    }

    function showTodayFollow() {
      onlyTodayFollow = true;
      renderCustomers();
    }

    function resetFilters() {
      onlyTodayFollow = false;

      const filterStatus = document.getElementById("filterStatus");
      const searchKeyword = document.getElementById("searchKeyword");

      if (filterStatus) {
        filterStatus.value = "全部客户";
      }

      if (searchKeyword) {
        searchKeyword.value = "";
      }

      renderCustomers();
    }

    function exportCustomers() {
      const exportData = currentDisplayCustomers.length > 0 ? currentDisplayCustomers : customers;

      if (exportData.length === 0) {
        alert("当前没有可导出的客户数据");
        return;
      }

      const headers = [
        "客户姓名",
        "联系电话",
        "小区名称",
        "房屋面积",
        "客户来源",
        "跟进状态",
        "装修需求",
        "跟进备注",
        "下次跟进时间"
      ];

      const rows = exportData.map(item => [
        item.name || "",
        item.phone || "",
        item.community || "",
        item.area || "",
        item.source || "",
        item.status || "",
        item.need || "",
        item.followNote || "",
        item.nextFollowDate || ""
      ]);

      let csvContent = "\uFEFF" + headers.join(",") + "\n";

      rows.forEach(row => {
        csvContent += row.map(value => {
          const text = String(value || "").replace(/"/g, '""');
          return `"${text}"`;
        }).join(",") + "\n";
      });

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "装修客户跟进表.csv";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    function updateStats() {
      document.getElementById("total").innerText = customers.length;
      document.getElementById("measured").innerText = customers.filter(c => c.status === "已量房").length;
      document.getElementById("deposit").innerText = customers.filter(c => c.status === "已交定金").length;
      document.getElementById("signed").innerText = customers.filter(c => c.status === "已签单").length;
    }

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    renderCustomers();
  </script>
</body>
</html>
